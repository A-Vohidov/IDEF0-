<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDEF0 Диаграммы</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f4f4f4;
    color: #111;
}

h1, h2 {
    text-align: center;
}

.diagram {
    background: white;
    padding: 30px;
    margin-bottom: 60px;
    border: 2px solid #333;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

svg {
    width: 100%;
    height: auto;
    border: 1px solid #999;
    background: #fff;
}

.block {
    fill: #e8eefc;
    stroke: #000;
    stroke-width: 2;
}

.arrow {
    stroke: #000;
    stroke-width: 2;
    fill: none;
    marker-end: url(#arrow);
}

.label {
    font-size: 14px;
    font-weight: bold;
}

.small {
    font-size: 12px;
}
</style>
</head>
<body>

<h1>ПОЛНАЯ IDEF0-МОДЕЛЬ</h1>
<h2>Информационная система продажи и заказа услуг</h2>

<svg viewBox="0 0 1400 700">

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="black"></path>
</marker>
</defs>

<line x1="150" y1="340" x2="500" y2="340" class="arrow"></line>

<text x="60" y="380" class="small">Платёжные данные</text>

<line x1="750" y1="100" x2="750" y2="250" class="arrow"></line>

<text x="530" y="70" class="small">Политика безопасности</text>
<text x="700" y="70" class="small">Бизнес-правила платформы</text>

<line x1="900" y1="350" x2="1250" y2="350" class="arrow"></line>
<line x1="900" y1="400" x2="1250" y2="400" class="arrow"></line>

<line x1="780" y1="600" x2="780" y2="430" class="arrow"></line>

</div>
